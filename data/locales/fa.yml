limitations:
  advanced-features-limited: امکانات پیشرفته محدودند
  advanced-setup: راه‌اندازی پیچیده‌تر
  advanced-workflow: شیب یادگیری بیشتر
  bare-metal: معمولاً به یک میزبان اختصاصی نیاز دارد
  browser-first: وب‌محور است
  cluster-oriented: کلاستر-محور است
  code-driven: گردش‌کار مبتنی بر کد
  collaboration-limited: امکانات همکاری داخلی محدودند
  community-compatible-server: سرور سازگارِ کامیونیتی است، نه سرور رسمی Bitwarden
  desktop-focused: متمرکز بر دسکتاپ
  developer-oriented: مناسب توسعه‌دهندگان و کاربران فنی
  docker-recommended: استفاده از Docker پیشنهاد می‌شود
  embedded-local-first: تعبیه‌شده و محلی است؛ انبارداده میزبانی‌شده نیست
  enterprise-paid: بعضی امکانات سازمانی پولی هستند
  extension-marketplace-differs: Marketplace افزونه‌ها و پیش‌فرض‌های telemetry با VS Code متفاوت است
  external-backend: به backend جداگانه برای متریک، لاگ یا داده نیاز دارد
  file-compatibility: سازگاری با فرمت‌های اختصاصی ممکن است متفاوت باشد
  flow-programming: از مدل برنامه‌نویسی Flow-based استفاده می‌کند
  format-support: پشتیبانی از codec و فرمت بسته به پلتفرم یا build متفاوت است
  gpu-recommended: برای بارهای کاری سنگین GPU پیشنهاد می‌شود
  hardware-integration-varies: پشتیبانی از سخت‌افزار و کنترلر متفاوت است
  ide-extension: به یک IDE پشتیبانی‌شده نیاز دارد
  linux-only: فقط لینوکس
  linux-server: نیازمند استقرار روی سرور لینوکس
  local-first-sync: همگام‌سازی و همکاری به تنظیمات یا سرویس جداگانه نیاز دارد
  local-library-only: فقط کتابخانه شخصی شما را استریم می‌کند؛ کاتالوگ تجاری ندارد
  mac-linux-only: نسخه native برای ویندوز ندارد
  matrix-account-or-server: به حساب یا سرور Matrix نیاز دارد
  metrics-focused: متمرکز بر متریک است؛ برای لاگ و trace به ابزارهای دیگری نیاز دارد
  model-download: مدل‌ها باید جداگانه دانلود شوند
  narrow-scope: دامنه قابلیت‌ها از یک مجموعه کامل محدودتر است
  newsletter-focused: بیشتر روی خبرنامه تمرکز دارد تا اتوماسیون بازاریابی کامل
  no-cloud-catalog: کاتالوگ تجاری مدل همراه ندارد
  no-native-windows: build بومی سرور برای ویندوز ندارد
  open-core: Open-core است؛ بخشی از کد یا قابلیت‌ها اختصاصی هستند
  paid-official-builds: باینری‌های رسمی ممکن است نیازمند پرداخت یا کمک مالی باشند
  partial-editor: برای ویرایش‌های ساده و بدون افت عالی است، اما NLE کامل نیست
  peer-to-peer-not-cloud: همگام‌سازی P2P است؛ فضای ابری میزبانی‌شده ندارد
  platform-feature-gaps: بعضی قابلیت‌ها بین سیستم‌عامل‌ها متفاوت‌اند
  plugin-ecosystem: اکوسیستم افزونه‌ها با محصول اختصاصی متفاوت است
  plugin-security: افزونه‌ها و قالب‌ها نیازمند نگهداری امنیتی هستند
  provider-required: مدل یا provider هوش مصنوعی باید جداگانه تنظیم شود
  publishing-focused: متمرکز بر انتشار است، نه یک CMS عمومی و کامل
  recording-not-editor: اول برای ضبط و استریم طراحی شده؛ ویرایشگر کامل ویدئو نیست
  requires-wordpress: به WordPress نیاز دارد
  resource-heavy: ممکن است منابع زیادی مصرف کند
  security-hardening: استقرارهای در دسترس اینترنت به سخت‌سازی امنیتی نیاز دارند
  self-hosting-optional: Self-hosting اختیاری است
  self-hosting-required: به Self-hosting یا سرور نیاز دارد
  server-admin: به مدیریت سرور نیاز دارد
  third-party-windows-builds: بیشتر buildهای ویندوز توسط third-party ارائه می‌شوند
  web-library: کتابخانه یا فریم‌ورک توسعه است، نه یک اپلیکیشن مستقل
  cli-first: گردش‌کار عمدتاً مبتنی بر CLI است
  upstream-read-only: مخزن upstream فقط‌خواندنی است و دیگر به‌طور فعال نگهداری نمی‌شود

notes:
  figma-penpot: طراحی UI/UX، پروتوتایپ، سیستم‌های طراحی و همکاری بلادرنگ.
  adobe-photoshop-gimp: ویرایش عمومی تصاویر رستری و دست‌کاری عکس.
  adobe-photoshop-krita: نقاشی دیجیتال، تصویرسازی و ویرایش تصاویر رستری.
  adobe-illustrator-inkscape: تصویرسازی برداری و ساخت SVG.
  adobe-indesign-scribus: نشر رومیزی و صفحه‌آرایی.
  adobe-lightroom-darktable: گردش‌کار غیرمخرب RAW و مدیریت عکس.
  adobe-lightroom-rawtherapee: پردازش RAW با کنترل دقیق.
  adobe-lightroom-digikam: مدیریت، برچسب‌گذاری و ویرایش عکس.
  canva-inkscape: برای طراحی برداری بسیار مناسب است؛ اما نسبت به Canva کمتر template محور است.
  canva-krita: برای آثار رستری و گرافیک شبکه‌های اجتماعی مناسب است.
  coreldraw-inkscape: گرافیک برداری و تصویرسازی.
  capcut-kdenlive: ویرایشگر غیرخطی کامل با افکت، عنوان، زیرنویس و تدوین چندترکه.
  capcut-shotcut: ویرایشگر تایم‌لاین چندسکویی با پشتیبانی گسترده از فرمت‌ها.
  capcut-openshot: ویرایشگر ویدئوی چندسکویی و مناسب تازه‌کارها.
  capcut-losslesscut: برای برش سریع و بدون افت و ویرایش‌های ساده عالی است.
  adobe-premiere-pro-kdenlive: گردش‌کار NLE چندترکه در سطح حرفه‌ای.
  adobe-premiere-pro-shotcut: NLE عمومی با فیلترها، scopeها و کنترل‌های خروجی.
  final-cut-pro-kdenlive: ویرایش حرفه‌ای چندسکویی.
  adobe-after-effects-blender: کامپوزیت، موشن گرافیک، tracking و سه‌بعدی.
  adobe-after-effects-natron: کامپوزیت node-based و VFX.
  adobe-after-effects-glaxnimate: انیمیشن برداری دوبعدی و موشن گرافیک.
  davinci-resolve-kdenlive: تدوین قدرتمندی دارد؛ Resolve همچنان در یکپارچگی رنگ، صدا و VFX گسترده‌تر است.
  davinci-resolve-blender: کامپوزیت، tracking و تدوین با Video Sequence Editor.
  screenflow-obs-studio: اولویت با ضبط و استریم است؛ برای تدوین می‌توانید آن را با Kdenlive ترکیب کنید.
  adobe-audition-audacity: ضبط و ویرایش waveform، پاک‌سازی صدا و پشتیبانی از pluginها.
  adobe-audition-ardour: DAW کامل برای ضبط، میکس و mastering.
  ableton-live-ardour: گردش‌کار حرفه‌ای DAW؛ تمرکز آن با clip launcher در Live متفاوت است.
  ableton-live-lmms: تولید موسیقی الکترونیک و sequencing.
  fl-studio-lmms: تولید موسیقی مبتنی بر pattern و MIDI sequencing.
  logic-pro-ardour: ضبط، ویرایش، میکس و pluginها.
  logic-pro-qtractor: sequencer چندترکه صوتی/MIDI با تمرکز بر لینوکس.
  serato-dj-mixxx: میکس DJ، مدیریت کتابخانه و پشتیبانی از controllerها.
  traktor-pro-mixxx: اجرای DJ و گردش‌کار با controllerها.
  autodesk-maya-blender: مدل‌سازی، انیمیشن، rigging، رندر و VFX.
  autodesk-3ds-max-blender: مجموعه عمومی ساخت محتوای سه‌بعدی.
  autocad-freecad: CAD سه‌بعدی پارامتریک و گردش‌کارهای فنی.
  autocad-librecad: نقشه‌کشی CAD دوبعدی.
  solidworks-freecad: CAD مکانیکی پارامتریک.
  solidworks-solvespace: CAD پارامتریک دوبعدی/سه‌بعدی مبتنی بر constraint.
  fusion-360-freecad: CAD پارامتریک؛ اکوسیستم و گردش‌کار آن با Fusion متفاوت است.
  fusion-360-openscad: مدل‌سازی solid مبتنی بر کد.
  sketchup-blender: مدل‌سازی انعطاف‌پذیر با شیب یادگیری بیشتر.
  sketchup-freecad: برای مهندسی مناسب‌تر است تا sketch سریع معماری.
  microsoft-office-libreoffice: شامل Writer، Calc، Impress، Draw، Base و Math.
  microsoft-365-onlyoffice: ویرایشگرهای اداری وب و دسکتاپ با سازگاری خوب با OOXML.
  google-docs-sheets-slides-onlyoffice: ویرایش مشارکتی اسناد در مرورگر.
  google-docs-sheets-slides-collabora-online: همکاری مرورگری بر پایه فناوری LibreOffice.
  adobe-acrobat-stirling-pdf: پلتفرم Open-core برای PDF؛ برای قابلیت‌های مورد استفاده، مرزهای مجوز upstream را بررسی کنید.
  adobe-acrobat-pdf-arranger: ادغام، تفکیک، چرخش، برش و مرتب‌سازی صفحات PDF.
  docusign-docuseal: امضای الکترونیکی self-hostable و گردش‌کار اسناد.
  docusign-opensign: گردش‌کار امضای الکترونیکی متن‌باز.
  notion-appflowy: پروژه‌ها، اسناد، دیتابیس‌ها و workspace مشارکتی.
  notion-logseq: مدیریت دانش Local-first و یادداشت‌های graph-based.
  evernote-joplin: یادداشت‌های Offline-first، notebookها، sync و web clipper.
  microsoft-onenote-joplin: یادداشت‌برداری چندسکویی با قابلیت sync.
  microsoft-onenote-xournalpp: یادداشت دست‌نویس، حاشیه‌نویسی PDF و گردش‌کار stylus.
  confluence-bookstack: مستندسازی ساختاریافته تیم و ویکی.
  confluence-wiki-js: ویکی مدرن و self-hosted.
  confluence-xwiki: پلتفرم توسعه‌پذیر ویکی و مدیریت دانش برای سازمان‌ها.
  slack-mattermost: پیام‌رسانی و همکاری تیمی self-hosted.
  slack-zulip: چت تیمی مبتنی بر topic.
  slack-rocket-chat: پیام‌رسانی self-hosted و ارتباطات omnichannel.
  discord-element: پیام‌رسانی غیرمتمرکز مبتنی بر Matrix.
  microsoft-teams-mattermost: چت و همکاری تیمی؛ اکوسیستم جلسات متفاوت است.
  zoom-jitsi-meet: ویدئوکنفرانس در مرورگر با امکان self-hosting.
  google-meet-jitsi-meet: جلسات ویدئویی تحت وب.
  zoom-bigbluebutton: کلاس آنلاین، وبینار و ابزارهای همکاری.
  calendly-cal-com: زیرساخت زمان‌بندی و صفحات رزرو.
  loom-obs-studio: برای capture و recording عالی است؛ اشتراک‌گذاری async به میزبانی جداگانه نیاز دارد.
  jira-openproject: Issue tracking، roadmap و مدیریت پروژه.
  jira-taiga: مدیریت پروژه Agile برای Scrum و Kanban.
  asana-openproject: برنامه‌ریزی پروژه، taskها و timelineها.
  asana-leantime: مدیریت پروژه و محصول.
  trello-wekan: بوردهای Kanban.
  trello-kanboard: Kanban مینیمال و self-hosted.
  miro-excalidraw: وایت‌بورد مشارکتی با سبک sketch.
  lucidchart-diagrams-net: دیاگرام، فلوچارت و ترسیم معماری.
  microsoft-visio-diagrams-net: رسم عمومی دیاگرام و فلوچارت.
  dropbox-nextcloud: فایل، sync، اشتراک‌گذاری و همکاری به‌صورت self-hosted.
  google-drive-nextcloud: پلتفرم sync و اشتراک فایل همراه با appها.
  onedrive-nextcloud: فضای ابری خصوصی و همکاری.
  dropbox-syncthing: همگام‌سازی پیوسته Peer-to-peer؛ فضای cloud میزبانی‌شده نیست.
